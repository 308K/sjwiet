<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); color: var(--color-on-surface); }
.row { display: flex; gap: var(--space-4); align-items: flex-start; margin-bottom: var(--space-2); flex-wrap: wrap; }
.label { font-size: var(--font-size-caption); font-weight: 600; color: var(--color-on-surface-variant); text-transform: uppercase; letter-spacing: .04em; min-width: 92px; padding-top: var(--space-2); flex-shrink: 0; }
.divider { border: none; border-top: 1px solid var(--color-outline); margin: var(--space-3) 0; }

/* @component-css-start */
.card { width: 100%; border-radius: var(--radius-md); overflow: hidden; transition: filter .15s; }
.card:hover { filter: brightness(0.97); }
.card.elevated { background: var(--color-card); box-shadow: var(--shadow-2); }
.card.outlined { background: transparent; border: 1px solid var(--color-outline-variant); }
.card.parchment { background: var(--color-surface); box-shadow: var(--shadow-1); }
.card-header { padding: var(--space-4) var(--space-4) var(--space-2); border-bottom: 1px solid var(--color-outline-variant); }
.card-body { padding: 0 var(--space-4) var(--space-4); }
.card.compact .card-header, .card.compact .card-body { padding: var(--space-2) var(--space-3); }
.card-footer { padding: var(--space-2) var(--space-4); border-top: 1px solid var(--color-outline-variant); }
.card-title { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); line-height: var(--line-height-h4); color: var(--color-on-surface); margin: 0; }
.card-body p { margin: 0; font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-on-surface-variant); }
/* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">提升卡片</span></div>
<div class="row">
  <div class="card elevated spacious" data-evidence-sample="elevated-spacious">
    <div class="card-header"><h3 class="card-title">关于我们</h3></div>
    <div class="card-body"><p>Khej UI 致力于打造优雅且高效的界面设计系统，融合东方美学与现代交互范式。</p></div>
  </div>
</div>
<div class="row">
  <div class="card elevated compact" data-evidence-sample="elevated-compact">
    <div class="card-header"><h3 class="card-title">快速入门</h3></div>
    <div class="card-body"><p>阅读文档了解核心组件与设计原则。</p></div>
  </div>
</div>
<hr class="divider">
<div class="row"><span class="label">描边卡片</span></div>
<div class="row">
  <div class="card outlined compact" data-evidence-sample="outlined-compact">
    <div class="card-header"><h3 class="card-title">服务详情</h3></div>
    <div class="card-body"><p>提供定制化设计系统搭建、组件库开发与视觉审计服务。</p></div>
  </div>
</div>
<div class="row"><span class="label">纸质卡片</span></div>
<div class="row">
  <div class="card parchment spacious" data-evidence-sample="parchment-spacious">
    <div class="card-header"><h3 class="card-title">设计理念</h3></div>
    <div class="card-body"><p>计白当黑，留白为美。每一处空白都是对内容的尊重，让界面呼吸自然。</p></div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tag — Khej UI</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .label { font-size: var(--font-size-caption); font-weight: 600; color: var(--color-on-surface-variant); min-width: 92px; flex-shrink: 0; text-transform: uppercase; letter-spacing: .04em; }
  .divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: 12px 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css by deterministic script */
  .tag { display: inline-flex; align-items: center; gap: 4px; border-radius: var(--radius-sm); white-space: nowrap; font-family: var(--font-family-base); font-weight: 500; line-height: 1; flex-shrink: 0; transition: background .15s, border-color .15s; cursor: default; }
  .tag-sm { height: 22px; min-width: 22px; padding: 3px 8px; font-size: 11px; }
  .tag-md { height: 28px; min-width: 28px; padding: 5px 12px; font-size: 13px; }
  .tag-default { background: transparent; color: var(--color-on-surface-variant); border: 1px solid var(--color-outline-variant); }
  .tag-default:hover { background: var(--color-surface-container-high); border-color: var(--color-outline); }
  .tag-seal { background: var(--color-primary); color: var(--color-on-primary); border: 1px solid var(--color-primary); }
  .tag-seal:hover { filter: brightness(1.08); }
  .tag-accent { background: var(--link); color: var(--color-on-primary); border: 1px solid transparent; }
  .tag-accent:hover { filter: brightness(1.08); }
  .tag-disabled { opacity: .45; pointer-events: none; cursor: not-allowed; }
  /* @component-css-end */
</style>
</head>
<body>
  <!-- Group 1: Variant scenarios -->
  <div class="row">
    <span class="label">默认轮廓</span>
    <span class="tag tag-sm tag-default" data-evidence-sample="default-sm">设计方案</span>
    <span class="tag tag-sm tag-default" data-evidence-sample="default-sm">待审核</span>
    <span class="tag tag-sm tag-default" data-evidence-sample="default-sm">草稿</span>
  </div>
  <div class="row">
    <span class="label">品牌钤印</span>
    <span class="tag tag-md tag-seal" data-evidence-sample="seal-md">Khej</span>
    <span class="tag tag-md tag-seal" data-evidence-sample="seal-md">认证</span>
    <span class="tag tag-md tag-seal" data-evidence-sample="seal-md">官方</span>
  </div>
  <div class="row">
    <span class="label">提示色</span>
    <span class="tag tag-md tag-accent" data-evidence-sample="accent-md">新功能</span>
    <span class="tag tag-md tag-accent" data-evidence-sample="accent-md">推荐</span>
    <span class="tag tag-md tag-accent" data-evidence-sample="accent-md">精选</span>
  </div>

  <hr class="divider">

  <!-- Group 2: Size & disabled comparison -->
  <div class="row">
    <span class="label">尺寸对比</span>
    <span class="tag tag-sm tag-default">小号标签</span>
    <span class="tag tag-md tag-default">中号标签</span>
  </div>
  <div class="row">
    <span class="label">禁用状态</span>
    <span class="tag tag-sm tag-default tag-disabled">已关闭</span>
    <span class="tag tag-md tag-seal tag-disabled">已过期</span>
    <span class="tag tag-md tag-accent tag-disabled">不可用</span>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal - Khej UI</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .specimen { max-width: 680px; }
  .stage { display: flex; flex-direction: column; gap: var(--space-4); }
  .story { display: flex; flex-direction: column; gap: var(--space-2); }
  .story-label { font-size: var(--font-size-caption); font-weight: 500; color: var(--color-on-surface-variant); text-transform: uppercase; letter-spacing: 0.04em; }
  .rail { display: flex; gap: var(--space-4); align-items: flex-start; flex-wrap: wrap; }
  .divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-2) 0; }

  /* @component-css-start */
  .modal-demo { position: relative; width: 100%; height: 260px; border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface-dim); }
  .modal-backdrop { position: absolute; inset: 0; }
  .modal-backdrop.backdrop-dialog { background: rgba(43,43,43,0.6); }
  .modal-backdrop.backdrop-scroll { background: rgba(43,43,43,0.7); }
  .modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 340px; display: flex; flex-direction: column; background: var(--color-card); color: var(--color-on-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-4); }
  .modal.wide { width: 88%; max-width: 460px; max-height: 210px; border-radius: var(--radius-lg); box-shadow: var(--shadow-5); background: var(--color-surface); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5) var(--space-2); flex-shrink: 0; }
  .modal-title { font-family: var(--font-heading); font-size: var(--font-size-h4); font-weight: var(--font-weight-h4); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .modal-close { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: none; background: transparent; cursor: pointer; color: var(--color-on-surface-variant); border-radius: var(--radius-sm); flex-shrink: 0; transition: background .15s; }
  .modal-close:hover { background: var(--color-surface-container-high); }
  .modal-body { padding: 0 var(--space-5) var(--space-4); font-size: var(--font-size-body); line-height: var(--line-height-body); color: var(--color-on-surface); overflow-y: auto; flex: 1; min-width: 0; }
  .modal-footer { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5); border-top: 1px solid var(--color-outline-variant); flex-shrink: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer; font-family: var(--font-family-base); font-size: var(--font-size-body); font-weight: var(--font-weight-body); white-space: nowrap; min-width: var(--size-button-sm); height: var(--size-button-sm); padding: 0 var(--space-4); border-radius: var(--radius-md); transition: background .15s, border-color .15s; flex-shrink: 0; }
  .btn-ghost { background: transparent; color: var(--color-on-surface-variant); border: 1px solid var(--color-outline); }
  .btn-ghost:hover { background: var(--color-surface-container-high); }
  .btn-primary { background: var(--color-primary); color: var(--color-on-primary); }
  .btn-primary:hover { background: var(--color-primary-hover); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="specimen">
  <div class="stage">
    <div class="story" data-evidence-sample="dialog">
      <span class="story-label">对话框</span>
      <div class="rail">
        <div class="modal-demo">
          <div class="modal-backdrop backdrop-dialog"></div>
          <div class="modal">
            <div class="modal-header">
              <h3 class="modal-title">确认操作</h3>
              <button class="modal-close" aria-label="关闭"><i data-lucide="x" style="width:18px;height:18px;display:inline-block"></i></button>
            </div>
            <div class="modal-body"><p>确定要继续执行此操作吗？此更改将无法撤销。</p></div>
            <div class="modal-footer">
              <button class="btn btn-ghost">取消</button>
              <button class="btn btn-primary">确认</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <hr class="divider">
    <div class="story" data-evidence-sample="scroll-overlay">
      <span class="story-label">滚动叠加</span>
      <div class="rail">
        <div class="modal-demo">
          <div class="modal-backdrop backdrop-scroll"></div>
          <div class="modal wide">
            <div class="modal-header">
              <h3 class="modal-title">使用条款</h3>
              <button class="modal-close" aria-label="关闭"><i data-lucide="x" style="width:18px;height:18px;display:inline-block"></i></button>
            </div>
            <div class="modal-body">
              <p>欢迎使用本服务。在使用之前，请仔细阅读以下条款与条件。通过访问或使用本服务，您同意受这些条款的约束。</p>
              <p>本服务按"现状"提供，不作任何明示或暗示的保证。我们保留随时修改或终止服务的权利，恕不另行通知。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>

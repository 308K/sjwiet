<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navigation — Khej UI</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Page scaffold — NOT extracted */
  body { margin: 0; padding: var(--space-3); background: var(--color-surface); font-family: var(--font-family-base); color: var(--color-on-surface); }
  .row { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { font-size: var(--font-size-caption); color: var(--color-on-surface-variant); min-width: 92px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; }
  .divider { border: none; border-top: 1px solid var(--color-outline-variant); margin: var(--space-3) 0; }

  /* @component-css-start */
  /* Component definitions — extracted to components.css */
  .nav-v { display: flex; flex-direction: column; flex: 1; min-width: 0; background: var(--color-surface); }
  .nav-v-item { position: relative; display: flex; align-items: center; justify-content: flex-end; padding: var(--space-2) var(--space-4); font-size: var(--font-size-body); color: var(--color-on-surface-variant); cursor: pointer; border: none; background: none; transition: color .15s, background .15s; white-space: nowrap; min-height: var(--size-button-sm); min-width: var(--size-button-sm); }
  .nav-v-item:hover { color: var(--color-primary); background: var(--color-surface-container-low); }
  .nav-v-item.active { color: var(--color-primary); }
  .nav-v-item.active::after { content: ''; position: absolute; right: 0; top: 4px; bottom: 4px; width: 2px; background: var(--color-primary); }

  .nav-h { display: flex; align-items: center; flex: 1; min-width: 0; border-bottom: 1px solid var(--color-outline-variant); background: var(--color-surface); overflow-x: auto; }
  .nav-h-item { position: relative; display: flex; align-items: center; padding: var(--space-2) var(--space-4); font-size: var(--font-size-body); color: var(--color-on-surface-variant); cursor: pointer; border: none; background: none; transition: color .15s; white-space: nowrap; min-height: var(--size-button-sm); min-width: var(--size-button-sm); }
  .nav-h-item:hover { color: var(--color-primary); }
  .nav-h-item.active { color: var(--color-primary); }
  .nav-h-item.active::after { content: ''; position: absolute; bottom: 0; left: var(--space-2); right: var(--space-2); height: 2px; background: var(--color-primary); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row">
  <span class="label">Vertical Tab</span>
  <nav class="nav-v">
    <a class="nav-v-item active">概述</a>
    <a class="nav-v-item">参数</a>
    <a class="nav-v-item">示例</a>
    <a class="nav-v-item">变更记录</a>
  </nav>
</div>
<hr class="divider">
<div class="row">
  <span class="label">Scroll Nav</span>
  <nav class="nav-h">
    <a class="nav-h-item active">全部</a>
    <a class="nav-h-item">进行中</a>
    <a class="nav-h-item">已完成</a>
    <a class="nav-h-item">已归档</a>
  </nav>
</div>
</body>
</html>
